<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Star Warp: Omni-Directional</title>
    <style>
        body {
            margin: 0; overflow: hidden; background-color: #000;
            font-family: 'Segoe UI', sans-serif; user-select: none;
        }
        canvas { display: block; width: 100vw; height: 100vh; }
        #video-input { display: none; }

        /* HUD 界面 */
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        .hud-top {
            display: flex; justify-content: space-between; padding: 40px 60px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
        }
        .hud-value { 
            font-size: 42px; font-weight: 300; color: #fff; font-family: monospace;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.5); font-variant-numeric: tabular-nums;
        }
        .hud-label { 
            font-size: 12px; color: #88aaff; letter-spacing: 2px; text-transform: uppercase;
        }

        /* 状态提示 */
        #warp-status {
            position: absolute; bottom: 18%; left: 50%; transform: translateX(-50%);
            color: #00ffff; font-size: 24px; font-weight: 800; letter-spacing: 10px;
            opacity: 0; transition: opacity 0.3s;
            text-shadow: 0 0 30px #00ffff; font-style: italic;
        }
        #warp-status.active { opacity: 1; transform: translateX(-50%) scale(1.1); }

        /* 弹窗 */
        #modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            text-align: center; background: rgba(5, 12, 24, 0.9);
            padding: 50px 80px; border: 1px solid #334455; border-radius: 8px;
            box-shadow: 0 0 80px rgba(0, 150, 255, 0.2);
            backdrop-filter: blur(15px);
            pointer-events: auto; min-width: 320px;
            border-top: 2px solid #00aaff;
            transition: opacity 0.3s;
        }
        h1 { margin: 0 0 15px 0; color: #fff; font-size: 32px; letter-spacing: 8px; font-weight: 300; }
        p { color: #8899aa; margin: 10px 0; font-size: 14px; letter-spacing: 1px; line-height: 1.6; }
        
        .btn {
            margin-top: 35px; padding: 14px 40px; font-size: 16px; font-weight: 600;
            color: #000; background: #00aaff; border: none; border-radius: 2px;
            cursor: pointer; letter-spacing: 3px;
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.4); transition: all 0.3s;
        }
        .btn:hover { background: #fff; box-shadow: 0 0 30px #fff; letter-spacing: 5px;}

    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
</head>
<body>

    <video id="video-input" playsinline></video>
    
    <div id="ui-layer">
        
        <div class="hud-top">
            <div>
                <div class="hud-value" id="dist-ui">0.0</div>
                <div class="hud-label">LIGHT YEARS</div>
            </div>
            <div style="text-align:right">
                <div class="hud-value" id="speed-ui">0</div>
                <div class="hud-label">VELOCITY</div>
            </div>
        </div>
        
        <div id="warp-status">WARP DRIVE ENGAGED</div>

        <div id="modal">
            <h1 id="modal-title">STAR WARP</h1>
            <p id="modal-desc">SYSTEM ONLINE</p>
            <button id="start-btn" class="btn" style="display:none">LAUNCH</button>
        </div>
    </div>

<script>
// ================= 配置 =================
const CONFIG = {
    normalSpeed: 60,
    warpSpeed: 180,
    accel: 0.8,
    tunnelRadius: 32,      
    
    // 飞行范围限制 (比隧道稍小)
    flightLimitX: 22,
    flightLimitY: 16,

    fovNormal: 70,
    fovWarp: 100,
    spawnRate: 100,
    
    colors: {
        bg: 0x010103,
        tunnel: 0x0a0015,
        rock: 0x666677,
        warpStar: 0x88ffff
    }
};

// ================= 状态 =================
const STATE = {
    running: false,
    speed: 0,
    distance: 0,
    
    // 玩家位置 (XY轴)
    playerX: 0,
    playerY: 0,
    // 目标位置
    targetX: 0,
    targetY: 0,

    isFist: false,
    isWarping: false,
    handDetected: false,
    frame: 0
};

// ================= Three.js 核心 =================
const scene = new THREE.Scene();
scene.background = new THREE.Color(CONFIG.colors.bg);
scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.007);

const camera = new THREE.PerspectiveCamera(CONFIG.fovNormal, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 5);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
document.body.appendChild(renderer.domElement);

// --- 灯光 ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambientLight);
const sunLight = new THREE.PointLight(0xaaddff, 1.5, 300);
sunLight.position.set(0, 50, -100);
scene.add(sunLight);
const shipLight = new THREE.PointLight(0x00ffff, 1.2, 50);
scene.add(shipLight);

// ================= 视觉核心 =================

// 1. 柔和粒子贴图
function createSoftParticleTexture() {
    const canvas = document.createElement('canvas');
    canvas.width = 32; canvas.height = 32;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
    grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
    grad.addColorStop(0.3, 'rgba(200, 220, 255, 0.6)');
    grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 32, 32);
    return new THREE.CanvasTexture(canvas);
}
const starTexture = createSoftParticleTexture();

// 2. 动态星云隧道 (更通透)
const tunnelGeo = new THREE.CylinderGeometry(CONFIG.tunnelRadius, CONFIG.tunnelRadius, 500, 32, 1, true);
tunnelGeo.rotateX(-Math.PI / 2);
tunnelGeo.translate(0, 0, -200);

const tunnelMat = new THREE.ShaderMaterial({
    uniforms: {
        uTime: { value: 0 },
        uSpeed: { value: 0 },
        uColor: { value: new THREE.Color(CONFIG.colors.tunnel) }
    },
    vertexShader: `
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
    `,
    fragmentShader: `
        uniform float uTime;
        uniform float uSpeed;
        uniform vec3 uColor;
        varying vec2 vUv;

        float random (in vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        float noise (in vec2 st) {
            vec2 i = floor(st); vec2 f = fract(st);
            float a = random(i); float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0)); float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a)* u.y * (1.0 - u.x) + (d - b) * u.x * u.y;
        }

        void main() {
            vec2 p = vUv * vec2(2.0, 8.0);
            p.y += uTime * 1.5;
            float n = noise(p);
            
            // 极淡的透明度，只保留边缘感
            float alpha = smoothstep(0.45, 0.8, n) * 0.12; 
            
            vec3 color = uColor + vec3(n * 0.3);
            color += vec3(0.5, 0.9, 1.0) * (uSpeed / 500.0);
            
            gl_FragColor = vec4(color, alpha);
        }
    `,
    transparent: true,
    side: THREE.BackSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
});
scene.add(new THREE.Mesh(tunnelGeo, tunnelMat));

// 3. 粒子流
const starsCount = 1000;
const starsGeo = new THREE.BufferGeometry();
const starsPos = [];
for(let i=0; i<starsCount; i++) {
    // 中空分布
    const minR = CONFIG.tunnelRadius * 0.4;
    const maxR = CONFIG.tunnelRadius * 0.95;
    const r = minR + Math.random() * (maxR - minR);
    const theta = Math.random() * Math.PI * 2;
    starsPos.push(r * Math.cos(theta), r * Math.sin(theta), (Math.random()-0.5)*500 - 150);
}
starsGeo.setAttribute('position', new THREE.Float32BufferAttribute(starsPos, 3));

const starsMat = new THREE.PointsMaterial({
    color: 0xffffff,
    size: 0.9,
    map: starTexture,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true
});
const starSystem = new THREE.Points(starsGeo, starsMat);
scene.add(starSystem);

// ================= 障碍物 =================
const meteors = [];
const meteorGeo = new THREE.IcosahedronGeometry(2.2, 0);
const meteorMat = new THREE.MeshStandardMaterial({
    color: CONFIG.colors.rock,
    roughness: 0.8,
    flatShading: true,
});

const frags = [];
const fragGeo = new THREE.TetrahedronGeometry(0.6, 0);
const fragMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });

function spawnMeteor() {
    if(!STATE.running) return;
    
    const m = new THREE.Mesh(meteorGeo, meteorMat.clone());
    
    // 全截面随机生成 (不仅是水平线)
    // 随机极坐标 -> 笛卡尔坐标
    const r = Math.random() * (CONFIG.tunnelRadius * 0.6); // 在半径60%区域内生成，迫使玩家利用全屏躲避
    const theta = Math.random() * Math.PI * 2;
    
    m.position.set(r * Math.cos(theta), r * Math.sin(theta), -400);
    
    m.userData = {
        rot: { x: Math.random()*0.05, y: Math.random()*0.05 },
        active: true
    };
    const s = 0.8 + Math.random() * 1.0;
    m.scale.set(s,s,s);
    
    scene.add(m);
    meteors.push(m);
}

function createExplosion(pos) {
    for(let i=0; i<8; i++) {
        const p = new THREE.Mesh(fragGeo, fragMat);
        p.position.copy(pos);
        p.userData.vel = new THREE.Vector3((Math.random()-0.5)*2, (Math.random()-0.5)*2, Math.random()*2 + 1);
        scene.add(p);
        frags.push(p);
    }
}

// ================= 核心逻辑 =================
const clock = new THREE.Clock();

function update(dt) {
    if(!STATE.running) return;

    // 1. 速度
    STATE.isWarping = STATE.isFist;
    let targetSpeed = STATE.isWarping ? CONFIG.warpSpeed : CONFIG.normalSpeed;
    STATE.speed += (targetSpeed - STATE.speed) * 0.1;
    
    if(STATE.isWarping) starsMat.color.setHex(CONFIG.colors.warpStar);
    else starsMat.color.setHex(0xffffff);

    const moveDist = STATE.speed * dt;
    STATE.distance += moveDist / 50;

    // 2. 场景动画
    tunnelMat.uniforms.uTime.value += dt * 0.5;
    tunnelMat.uniforms.uSpeed.value = STATE.speed;
    
    const pos = starSystem.geometry.attributes.position.array;
    for(let i=0; i<starsCount; i++) {
        const idx = i*3;
        pos[idx+2] += moveDist * 1.2;
        if(pos[idx+2] > 50) {
            pos[idx+2] = -400;
            // 重新随机分布
            const minR = CONFIG.tunnelRadius * 0.4;
            const maxR = CONFIG.tunnelRadius * 0.95;
            const r = minR + Math.random() * (maxR - minR);
            const theta = Math.random() * Math.PI * 2;
            pos[idx] = r * Math.cos(theta);
            pos[idx+1] = r * Math.sin(theta);
        }
    }
    starSystem.geometry.attributes.position.needsUpdate = true;

    // 3. 飞船物理控制 (6DOF Simulation)
    if(!STATE.handDetected) {
        STATE.targetX *= 0.98;
        STATE.targetY *= 0.98;
    }

    // XY轴平滑移动
    STATE.playerX += (STATE.targetX - STATE.playerX) * 0.1;
    STATE.playerY += (STATE.targetY - STATE.playerY) * 0.1;
    
    // 边界限制
    STATE.playerX = Math.max(-CONFIG.flightLimitX, Math.min(CONFIG.flightLimitX, STATE.playerX));
    STATE.playerY = Math.max(-CONFIG.flightLimitY, Math.min(CONFIG.flightLimitY, STATE.playerY));
    
    // 更新相机/飞船位置
    camera.position.x = STATE.playerX;
    camera.position.y = STATE.playerY;

    // 飞行姿态计算 (关键: 增加俯仰和滚转反馈)
    // 滚转 (Roll): 向左移动时，机身向左倾斜
    const targetRoll = -STATE.playerX * 0.02; 
    // 俯仰 (Pitch): 向上移动时，机头抬起 (负X旋转)
    const targetPitch = STATE.playerY * 0.02;
    // 偏航 (Yaw): 稍微带一点转向感
    const targetYaw = -STATE.playerX * 0.01;

    camera.rotation.z = targetRoll; // Z轴旋转控制滚转
    camera.rotation.x = targetPitch; // X轴旋转控制俯仰
    camera.rotation.y = targetYaw;

    // FOV动态
    const targetFov = STATE.isWarping ? CONFIG.fovWarp : CONFIG.fovNormal;
    camera.fov += (targetFov - camera.fov) * 0.05;
    camera.updateProjectionMatrix();
    
    // 灯光跟随
    shipLight.position.set(camera.position.x, camera.position.y, -5);

    // 4. 障碍物碰撞
    for(let i=meteors.length-1; i>=0; i--) {
        const m = meteors[i];
        m.position.z += moveDist;
        m.rotation.x += 0.02; m.rotation.y += 0.03;
        
        if(m.userData.active && m.position.z > -5 && m.position.z < 2) {
            // 3D 距离检测 (XY平面距离)
            const dx = m.position.x - STATE.playerX;
            const dy = m.position.y - STATE.playerY;
            const dist = Math.sqrt(dx*dx + dy*dy);
            
            if(dist < 3.5) {
                if(STATE.isWarping) {
                    createExplosion(m.position);
                    m.visible = false;
                    m.userData.active = false;
                } else {
                    gameOver();
                }
            }
        }
        if(m.position.z > 20) { scene.remove(m); meteors.splice(i, 1); }
    }
    
    // 碎屑
    for(let i=frags.length-1; i>=0; i--) {
        const p = frags[i];
        p.position.add(p.userData.vel);
        p.scale.multiplyScalar(0.92);
        if(p.scale.x < 0.05) { scene.remove(p); frags.splice(i, 1); }
    }

    // 生成
    STATE.frame++;
    const rate = Math.max(20, CONFIG.spawnRate - STATE.speed * 0.3);
    if(STATE.frame > rate) {
        if(Math.random() > 0.3) spawnMeteor();
        STATE.frame = 0;
    }
    
    // UI状态
    const warpUI = document.getElementById('warp-status');
    if(STATE.isWarping) warpUI.classList.add('active');
    else warpUI.classList.remove('active');

    document.getElementById('speed-ui').innerText = Math.floor(STATE.speed);
    document.getElementById('dist-ui').innerText = STATE.distance.toFixed(1);
}

function gameOver() {
    STATE.running = false;
    const modal = document.getElementById('modal');
    document.getElementById('modal-title').innerText = "CRITICAL DAMAGE";
    document.getElementById('modal-title').style.color = "#ff4444";
    document.getElementById('modal-desc').innerHTML = `MISSION ABORTED<br>DISTANCE: ${STATE.distance.toFixed(1)} LY`;
    const btn = document.getElementById('start-btn');
    btn.innerText = "RESTART SYSTEM";
    btn.style.display = "inline-block";
    modal.style.opacity = 1;
    modal.style.pointerEvents = 'auto';
}

function resetGame() {
    STATE.speed = 0;
    STATE.distance = 0;
    STATE.playerX = 0;
    STATE.playerY = 0;
    STATE.targetX = 0;
    STATE.targetY = 0;
    STATE.running = true;
    STATE.frame = 0;
    
    meteors.forEach(m => scene.remove(m));
    meteors.length = 0;
    frags.forEach(p => scene.remove(p));
    frags.length = 0;
    
    const modal = document.getElementById('modal');
    modal.style.opacity = 0;
    modal.style.pointerEvents = 'none';
}

// ================= Hand Tracking (Omni-Directional) =================
const videoEl = document.getElementById('video-input');

function onHandResults(results) {
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        STATE.handDetected = true;
        const lm = results.multiHandLandmarks[0];
        
        // 1. 位置映射 (X & Y)
        let rawX = lm[9].x; 
        let rawY = lm[9].y;
        
        // X轴: 翻转 + 放大
        // 屏幕左(x大) -> 左移
        let steerX = (0.5 - rawX) * 3.5; 
        
        // Y轴: 
        // 原始数据: 0(上) -> 1(下)
        // 3D坐标: +Y(上) -> -Y(下)
        // 所以我们希望手向上(rawY小) -> 目标向上(targetY大)
        let steerY = (0.5 - rawY) * 3.0;

        STATE.targetX = steerX * CONFIG.flightLimitX;
        STATE.targetY = steerY * CONFIG.flightLimitY;

        // 2. 握拳检测
        const wrist = lm[0];
        const tips = [8, 12, 16, 20];
        const mcps = [5, 9, 13, 17];
        let folded = 0;
        tips.forEach((tipIdx, i) => {
            const dTip = Math.hypot(lm[tipIdx].x - wrist.x, lm[tipIdx].y - wrist.y);
            const dMcp = Math.hypot(lm[mcps[i]].x - wrist.x, lm[mcps[i]].y - wrist.y);
            if (dTip < dMcp * 1.1) folded++;
        });
        STATE.isFist = (folded >= 3);
        
    } else {
        STATE.handDetected = false;
        STATE.isFist = false;
    }
}

// ================= Init =================
window.onload = function() {
    const desc = document.getElementById('modal-desc');
    const btn = document.getElementById('start-btn');
    
    const hands = new Hands({locateFile: (file) => {
        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
    }});
    hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 0,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });
    hands.onResults(onHandResults);
    
    const cameraUtils = new Camera(videoEl, {
        onFrame: async () => { await hands.send({image: videoEl}); },
        width: 320, height: 240
    });
    
    desc.innerHTML = "MOVE HAND: UP/DOWN/LEFT/RIGHT<br>MAKE FIST: WARP SPEED";
    btn.style.display = "inline-block";
    
    btn.onclick = async () => {
        if (!STATE.running) {
            btn.innerText = "CALIBRATING...";
            try {
                await cameraUtils.start();
                videoEl.play();
                resetGame();
            } catch(e) {
                desc.innerText = "CAMERA ERROR";
            }
        } else {
            resetGame();
        }
    };
    
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth/window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
    
    function animate() {
        requestAnimationFrame(animate);
        update(clock.getDelta());
        renderer.render(scene, camera);
    }
    animate();
};
</script>
</body>
</html>
